# Docs site (this repo) — Next.js 16 + Fumadocs
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Static assets load at /docs/_next/* when proxied from warren.kodeus.ai/docs
  ASSET_PREFIX = "/docs"

# Edge redirect on the docs deploy itself (direct URL or after proxy)
[[redirects]]
  from = "/docs"
  to = "/docs/introduction/what-is-kodeus"
  status = 307
